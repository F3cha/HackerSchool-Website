spring.application.name=website

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackerschool}
spring.datasource.username=${DB_USERNAME:hackerschool}
spring.datasource.password=${DB_PASSWORD:hackerschool}

# Hibernate creates/updates tables from the entities for now. Switch to validate once Flyway migrations exist.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.storage.location=${STORAGE_LOCATION:uploads}
app.storage.public-path=/files
